# Configuracao do Driver e URL de Conexao
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/acabaaqui_db

# Credenciais de acesso
#quarkus.datasource.username=${username}
quarkus.datasource.username=acabaaqui_server
#quarkus.datasource.password=${password}
quarkus.datasource.password=10534954

# Estrategia Hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.log.level=INFO

# CORS para o app Expo/React Native
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*

# Permite conexoes de dispositivos na rede local somente no perfil de desenvolvimento.
%dev.quarkus.http.host=0.0.0.0

# Configure APP_JWT_SECRET with a Base64-encoded secret of at least 32 bytes.
#app.jwt.secret=${APP_JWT_SECRET}
app.jwt.secret=tcBDWWvRGY9P0yKOcCNhI5499kK5/O5P4ACyjldldmM
app.jwt.issuer=acaba-aqui
app.jwt.duration-seconds=3600

app.email-verification.hmac-secret=${APP_EMAIL_VERIFICATION_SECRET}

# Mailpit local, usando SMTP na porta 1025 sem autenticacao ou TLS.
%dev.quarkus.mailer.host=${SMTP_HOST:localhost}
%dev.quarkus.mailer.port=${SMTP_PORT:1025}
%dev.quarkus.mailer.username=${SMTP_USERNAME:}
%dev.quarkus.mailer.password=${SMTP_PASSWORD:}
%dev.quarkus.mailer.from=${SMTP_FROM:no-reply@acaba-aqui.local}
%dev.quarkus.mailer.start-tls=DISABLED
%dev.quarkus.mailer.mock=${SMTP_MOCK:false}

%test.quarkus.mailer.mock=true

# Producao usa provedor SMTP configurado pelo ambiente, nunca o Mailpit local.
%prod.quarkus.mailer.host=${SMTP_HOST}
%prod.quarkus.mailer.port=${SMTP_PORT:587}
%prod.quarkus.mailer.username=${SMTP_USERNAME}
%prod.quarkus.mailer.password=${SMTP_PASSWORD}
%prod.quarkus.mailer.from=${SMTP_FROM}
%prod.quarkus.mailer.start-tls=${SMTP_START_TLS:REQUIRED}
%prod.quarkus.mailer.mock=false